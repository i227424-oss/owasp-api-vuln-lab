# H2 + JPA
spring.datasource.url=jdbc:h2:mem:apilab;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# FIX-7: Strong JWT secret from environment variable with secure fallback
# In production, set APP_JWT_SECRET environment variable
app.jwt.secret=${APP_JWT_SECRET:changeThisToAVeryLongAndSecureRandomStringInProduction123456789}
# FIX-7: Reduced token TTL to 1 hour (3600 seconds) instead of 30 days
app.jwt.ttl-seconds=3600
# FIX-7: JWT issuer and audience for enhanced security
app.jwt.issuer=owasp-api-vuln-lab
app.jwt.audience=owasp-api-clients

# FIX-8: Reduce error detail exposure (hide stack traces in production)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.level.root=INFO
